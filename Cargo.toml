[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/process",
    "crates/platform-linux",
    "crates/platform-windows",
    "crates/fc27",
    "crates/lua-compat",
    "crates/gui",
    "crates/cli",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
fc27-core = { path = "crates/core" }
fc27-process = { path = "crates/process" }
fc27-platform-linux = { path = "crates/platform-linux" }
fc27-game = { path = "crates/fc27" }
fc27-lua-compat = { path = "crates/lua-compat" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
unicode-normalization = "0.1"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
clap = { version = "4.5", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
